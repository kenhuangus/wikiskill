name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,ui]"
      - name: Run tests
        run: pytest -q --timeout=120
      - name: CLI demo (mock, end-to-end)
        run: python -m wikiskill.demo --root ci_demo --iterations 3
      - name: Live-server smoke test
        run: python smoke_test.py
